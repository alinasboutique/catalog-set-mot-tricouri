<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalog Manager • Alina's Handmade Boutique</title>
<style>
:root{--olive:#6f7d4d;--olive2:#87945e;--cream:#f7f7f1;--line:#dfe3d2;--text:#303728}*{box-sizing:border-box}body{margin:0;background:#fbfbf8;color:var(--text);font-family:Arial,sans-serif}header{padding:28px 6%;border-bottom:1px solid var(--line);background:#fff}header h1{margin:0;font-family:Georgia,serif;font-size:32px;font-weight:500}header p{margin:5px 0 0;letter-spacing:2px;font-size:11px;color:#7a826b}.wrap{max-width:1250px;margin:30px auto;padding:0 24px}.hero{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;margin-bottom:20px}.hero h2{font-family:Georgia,serif;margin:0 0 6px;font-size:34px}.hero p{margin:0;color:#68705d}.toolbar{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px;margin-top:20px}input,select,textarea{width:100%;padding:12px;border:1px solid #d4dac4;border-radius:12px;background:#fff;font:inherit;color:var(--text)}textarea{min-height:78px;resize:vertical}.btn{border:0;border-radius:12px;padding:12px 17px;background:var(--olive);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#eef1e7;color:#4f5b39}.btn.danger{background:#f1eee8;color:#5e584d}.categories{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#f3f5ed}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 5px 20px #00000008}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.photo{height:105px;border-radius:10px;overflow:hidden;background:#f0f2e9;position:relative;display:flex;align-items:center;justify-content:center;font-size:11px;color:#89917a;text-align:center}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:5px;top:5px;border:0;border-radius:50%;width:25px;height:25px;background:#fff;color:#8a6b6b;cursor:pointer}.card h3{font-family:Georgia,serif;font-size:22px;margin:6px 0}.meta{font-size:12px;color:#737a69;margin-bottom:12px}.fields{display:grid;grid-template-columns:1.4fr .8fr;gap:8px}.full{grid-column:1/-1}.custom{margin-top:8px}.actions{display:flex;gap:8px;margin-top:10px}.actions .btn{flex:1}.empty{text-align:center;padding:40px;background:#fff;border:1px dashed var(--line);border-radius:18px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.open{display:flex}.modalbox{background:#fff;border-radius:20px;padding:24px;width:min(650px,100%);max-height:90vh;overflow:auto}.modalbox h3{font-family:Georgia,serif;font-size:27px;margin-top:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.toolbar,.row{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>Alina's Handmade Boutique</h1><p>CATALOG MANAGER</p></header>
<div class="wrap">
<section class="hero"><h2>Photo Manager</h2><p>Adaugă și modifică produsele care apar în catalogul clientului: fotografii, denumire, descriere, preț, cantitate și personalizare.</p><div class="toolbar"><input id="search" placeholder="Caută un produs..."><select id="filter"><option value="">Toate categoriile</option></select><select id="sort"><option value="name">Denumire</option><option value="price">Preț</option><option value="category">Categorie</option></select><button class="btn" onclick="openProduct()">+ Produs nou</button></div><div class="categories" id="cats"></div></section>
<div class="grid" id="grid"></div>
</div>
<div class="modal" id="modal"><div class="modalbox"><h3>Adaugă produs nou</h3><div class="row"><div><label>Denumire produs</label><input id="nName" placeholder="Ex. Tricou personalizat"></div><div><label>Preț (£)</label><input id="nPrice" type="number" step="0.01" placeholder="Ex. 17"></div></div><div class="row"><div><label>Categorie</label><select id="nCat"></select></div><div><label>Număr bucăți</label><input id="nQty" type="number" min="1" value="1"></div></div><label>Descriere</label><textarea id="nDesc" placeholder="Descrierea care va apărea în catalog..."></textarea><div style="margin-top:10px"><label>Opțiuni de personalizare</label><textarea id="nCustom" placeholder="Ex. Nume, cifră, fotografie copil, text personalizat"></textarea></div><div class="modal-actions"><button class="btn secondary" onclick="closeProduct()">Anulează</button><button class="btn" onclick="addProduct()">Adaugă produs</button></div></div></div>
<input id="file" type="file" accept="image/*" multiple hidden>
<script>
const KEY='alina_catalog_v5';
const baseCats=['Seturi pentru Moț','Tricouri personalizate','Ecusoane personalizate','Cake Toppers','Nuntă','Botez','Cadouri personalizate'];
const seed=[
{id:1,name:'Set moț băiat',price:70,qty:1,category:'Seturi pentru Moț',desc:'Set personalizat pentru moț. Tavă dreptunghiulară £70 sau tavă rotundă £80.',custom:'Nume, fotografie copil, text personalizat',photos:[]},
{id:2,name:'Set moț fetiță',price:70,qty:1,category:'Seturi pentru Moț',desc:'Set personalizat pentru moț. Tavă dreptunghiulară £70 sau tavă rotundă £80.',custom:'Nume, fotografie copil, text personalizat',photos:[]}
];
let data=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function cats(){return [...new Set([...baseCats,...data.map(x=>x.category).filter(Boolean)])]}
function render(){let c=cats();filter.innerHTML='<option value="">Toate categoriile</option>'+c.map(x=>`<option>${esc(x)}</option>`).join('');nCat.innerHTML=c.map(x=>`<option>${esc(x)}</option>`).join('');let q=search.value.toLowerCase(),f=filter.value,s=sort.value;let arr=data.filter(x=>(!q||(x.name+' '+x.desc).toLowerCase().includes(q))&&(!f||x.category===f));arr.sort((a,b)=>s==='price'?a.price-b.price:s==='category'?a.category.localeCompare(b.category,'ro'):a.name.localeCompare(b.name,'ro'));catsEl();grid.innerHTML=arr.length?arr.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Nu există produse pentru această selecție.</div>'}
function catsEl(){cats.innerHTML=cats().map(x=>`<span class="pill">${esc(x)}</span>`).join('')}
function card(x){let photos=(x.photos||[]);return `<article class="card"><div class="photos">${[0,1,2].map((_,i)=>photos[i]?`<div class="photo"><img src="${photos[i]}" alt=""><button onclick="delPhoto(${x.id},${i})">×</button></div>`:`<div class="photo">Alege fotografie</div>`).join('')}</div><h3>${esc(x.name)}</h3><div class="meta">${esc(x.category)} · ${photos.length} fotografii</div><div class="fields"><input value="${attr(x.name)}" onchange="edit(${x.id},'name',this.value)" placeholder="Denumire"><input type="number" step="0.01" value="${x.price}" onchange="edit(${x.id},'price',this.value)" placeholder="Preț £"><select class="full" onchange="edit(${x.id},'category',this.value)">${cats().map(c=>`<option ${c===x.category?'selected':''}>${esc(c)}</option>`).join('')}</select><textarea class="full" onchange="edit(${x.id},'desc',this.value)" placeholder="Descriere">${esc(x.desc||'')}</textarea><textarea class="full custom" onchange="edit(${x.id},'custom',this.value)" placeholder="Opțiuni de personalizare">${esc(x.custom||'')}</textarea><input type="number" min="1" value="${x.qty||1}" onchange="edit(${x.id},'qty',this.value)" placeholder="Nr. bucăți"></div><div class="actions"><button class="btn" onclick="choose(${x.id})">+ Alege fotografii</button><button class="btn danger" onclick="removeProduct(${x.id})">Șterge produs</button></div></article>`}
function edit(id,k,v){let x=data.find(x=>x.id===id);if(!x)return;x[k]=k==='price'||k==='qty'?Number(v):v;save()}
function choose(id){file.onchange=async()=>{let x=data.find(x=>x.id===id);for(const f of file.files){let r=new FileReader();r.onload=()=>{x.photos=x.photos||[];x.photos.push(r.result);save()};r.readAsDataURL(f)}file.value=''};file.click()}
function delPhoto(id,i){let x=data.find(x=>x.id===id);x.photos.splice(i,1);save()}
function removeProduct(id){if(confirm('Ștergi acest produs?')){data=data.filter(x=>x.id!==id);save()}}
function openProduct(){modal.classList.add('open');nName.value='';nPrice.value='';nQty.value=1;nDesc.value='';nCustom.value='';nCat.value=cats()[0]}
function closeProduct(){modal.classList.remove('open')}
function addProduct(){let name=nName.value.trim();if(!name){alert('Completează denumirea produsului.');return}data.push({id:Date.now(),name,price:Number(nPrice.value)||0,qty:Number(nQty.value)||1,category:nCat.value,desc:nDesc.value.trim(),custom:nCustom.value.trim(),photos:[]});save();closeProduct()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function attr(s=''){return esc(s)}
search.oninput=render;filter.onchange=render;sort.onchange=render;render();
</script></body></html>
