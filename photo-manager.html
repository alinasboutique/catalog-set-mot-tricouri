<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Manager | Alina's Handmade Boutique</title><style>:root{--bg:#faf9f4;--paper:#fff;--olive:#68734d;--ink:#30352b;--muted:#737868;--line:#e1e3d7;--soft:#f0f2e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:0 22px}header{background:#fff;border-bottom:1px solid var(--line)}.head{min-height:80px;display:flex;align-items:center;justify-content:space-between}.brand{font:500 27px Georgia,serif;color:var(--olive)}a{color:var(--olive);text-decoration:none}.back{font-size:13px}.page{padding:45px 0}.intro{margin-bottom:25px}.intro h1{font:500 42px Georgia,serif;margin:0 0 8px}.intro p{color:var(--muted);line-height:1.6}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 10px 30px #3740270d;margin-bottom:20px}label{display:block;font-size:13px;font-weight:bold;margin:13px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d6d9cb;border-radius:10px;font:inherit;background:#fff}textarea{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.upload{border:2px dashed #cfd4c1;border-radius:14px;padding:18px;text-align:center;background:#fafbf7}.upload input{border:0;padding:5px}.preview{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px}.preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.save{margin-top:18px;border:0;background:var(--olive);color:white;border-radius:10px;padding:13px 18px;font-weight:bold;cursor:pointer}.status{margin-top:12px;padding:10px;border-radius:10px;background:var(--soft);font-size:13px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.product{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.product img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.product h3{font:500 20px Georgia,serif;margin:10px 0 5px}.product p{font-size:12px;color:var(--muted);line-height:1.5}@media(max-width:700px){.row,.products{grid-template-columns:1fr}.preview{grid-template-columns:repeat(3,1fr)}}</style></head><body><header><div class="wrap head"><div class="brand">Alina's Handmade Boutique</div><a class="back" href="index.html">← Înapoi la catalog</a></div></header><main class="wrap page"><div class="intro"><h1>Photo Manager</h1><p>Aici adaugi produsele noi. Completezi informațiile, alegi fotografiile de pe calculator și produsul va apărea automat în catalog.</p></div><section class="panel"><h2>+ Adaugă produs nou</h2><div class="row"><div><label>Categorie</label><select id="category"><option>Ecusoane personalizate</option><option>Cake Toppers</option><option>Nuntă</option><option>Botez</option><option>Cadouri personalizate</option></select></div><div><label>Denumire produs</label><input id="name" placeholder="Ex. Cană personalizată"></div></div><div class="row"><div><label>Preț (£)</label><input id="price" type="number" step="0.01" placeholder="0.00"></div><div><label>Număr bucăți</label><input id="qty" type="number" min="1" value="1"></div></div><label>Descriere</label><textarea id="description" placeholder="Descrierea produsului..."></textarea><label>Opțiuni de personalizare</label><textarea id="personalization" placeholder="Ex. nume, fotografie, text, culoare..."></textarea><label>Fotografii</label><div class="upload"><input id="photos" type="file" accept="image/*" multiple><div class="preview" id="preview"></div></div><button class="save" id="save">Salvează produsul</button><div class="status" id="status">Completează formularul și adaugă fotografiile.</div></section><section class="panel"><h2>Produse adăugate</h2><div id="products" class="products"><div class="status">Se încarcă...</div></div></section></main><script src="supabase-config.js"></script><script>const S=window.SUPABASE_CONFIG,API=S.url+'/rest/v1',H={apikey:S.anonKey,Authorization:'Bearer '+S.anonKey,'Content-Type':'application/json'},bucket='catalog',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const status=t=>{$('status').textContent=t};$('photos').addEventListener('change',()=>{$('preview').innerHTML=[...$('photos').files].map(f=>'<img src="'+URL.createObjectURL(f)+'">').join('')});async function save(){const name=$('name').value.trim(),category=$('category').value,price=parseFloat($('price').value),quantity=parseInt($('qty').value||'1'),description=$('description').value.trim(),personalization_options=$('personalization').value.trim(),files=[...$('photos').files];if(!name||!Number.isFinite(price)||!files.length){status('Completează denumirea, prețul și adaugă cel puțin o fotografie.');return}status('Se salvează produsul...');try{const r=await fetch(API+'/catalog_products',{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify({name,category,price,description,personalization_options,quantity,is_active:true,display_order:0})});if(!r.ok)throw Error(await r.text());const product=(await r.json())[0];for(let i=0;i<files.length;i++){const f=files[i],safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=Date.now()+'-'+Math.random().toString(36).slice(2)+'-'+safe;const up=await fetch(S.url+'/storage/v1/object/'+bucket+'/'+path,{method:'POST',headers:{apikey:S.anonKey,Authorization:'Bearer '+S.anonKey,'Content-Type':f.type||'image/jpeg','x-upsert':'false'},body:f});if(!up.ok)throw Error('Fotografia nu a putut fi încărcată: '+await up.text());const pr=await fetch(API+'/catalog_product_photos',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({product_id:product.id,image_url:path,display_order:i})});if(!pr.ok)throw Error(await pr.text())}status('Produsul a fost adăugat cu succes în catalog.');['name','price','description','personalization'].forEach(id=>$(id).value='');$('photos').value='';$('preview').innerHTML='';load()}catch(e){console.error(e);status('Eroare: '+e.message)}}$('save').onclick=save;async function load(){try{const r=await fetch(API+'/catalog_products?select=*&is_active=eq.true&order=created_at.desc',{headers:H});if(!r.ok)throw Error(await r.text());const items=await r.json();$('products').innerHTML=items.map(x=>'<article class="product"><div style="aspect-ratio:1;background:var(--soft);border-radius:10px;display:grid;place-items:center;color:#8a917a">Produs</div><h3>'+esc(x.name)+'</h3><b style="color:var(--olive)">£'+Number(x.price||0).toFixed(2)+'</b><p>'+esc(x.category||'')+(x.description?'<br>'+esc(x.description):'')+'</p></article>').join('')||'<div class="status">Nu există încă produse adăugate prin Photo Manager.</div>'}catch(e){$('products').innerHTML='<div class="status">Nu am putut încărca produsele.</div>'}}load();</script></body></html>
