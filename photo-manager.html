<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alina's Handmade Boutique • Catalog Manager</title><style>:root{--o:#707d4f;--l:#dfe3d2;--bg:#fafaf6;--t:#303728}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}header{background:#fff;border-bottom:1px solid var(--l);padding:28px 6%}h1{font:500 34px Georgia;margin:0}header p{margin:5px 0 0;font-size:11px;letter-spacing:2px;color:#7b836b}.wrap{max-width:1250px;margin:28px auto;padding:0 24px}.hero,.card{background:#fff;border:1px solid var(--l);border-radius:20px}.hero{padding:24px;margin-bottom:20px}.hero h2{font:500 34px Georgia;margin:0 0 6px}.hero p{color:#68705d}.toolbar{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px;margin-top:20px}input,select,textarea{width:100%;padding:12px;border:1px solid #d4dac4;border-radius:11px;background:#fff;font:inherit;color:var(--t)}textarea{min-height:70px;resize:vertical}.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--o);color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#eef1e7;color:#4f5b39}.btn.danger{background:#f1eee8;color:#5e584d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{padding:14px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.photo{height:105px;border-radius:10px;background:#f0f2e9;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;font-size:11px;color:#89917a;text-align:center}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:5px;top:5px;border:0;border-radius:50%;background:#fff;width:25px;height:25px;cursor:pointer}.card h3{font:500 22px Georgia;margin:6px 0}.meta{font-size:12px;color:#737a69;margin-bottom:10px}.fields{display:grid;grid-template-columns:1.4fr .8fr;gap:8px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.modalbox{background:#fff;border-radius:20px;padding:24px;width:min(650px,100%);max-height:90vh;overflow:auto}.modalbox h3{font:500 28px Georgia;margin-top:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.toolbar,.row{grid-template-columns:1fr}}</style></head><body><header><h1>Alina's Handmade Boutique</h1><p>CATALOG MANAGER</p></header><main class="wrap"><section class="hero"><h2>Photo Manager</h2><p>Gestionează produsele care apar în catalog: fotografii, denumire, descriere, preț, număr de bucăți și personalizare.</p><div class="toolbar"><input id="search" placeholder="Caută un produs..."><select id="filter"></select><select id="sort"><option value="name">Denumire</option><option value="price">Preț</option><option value="category">Categorie</option></select><button class="btn" onclick="openProduct()">+ Produs nou</button></div></section><div class="grid" id="grid"></div></main><div class="modal" id="modal"><div class="modalbox"><h3>Produs nou</h3><div class="row"><div><label>Denumire</label><input id="nName" placeholder="Ex. Tricou personalizat"></div><div><label>Preț (£)</label><input id="nPrice" type="number" step="0.01" placeholder="Ex. 17"></div></div><div class="row"><div><label>Categorie</label><select id="nCat"></select></div><div><label>Număr bucăți</label><input id="nQty" type="number" min="1" value="1"></div></div><label>Descriere</label><textarea id="nDesc" placeholder="Descrierea produsului..."></textarea><br><label>Opțiuni de personalizare</label><textarea id="nCustom" placeholder="Ex. Nume, cifră, fotografie copil, text personalizat"></textarea><div class="modal-actions"><button class="btn secondary" onclick="closeProduct()">Anulează</button><button class="btn" onclick="addProduct()">Adaugă produs</button></div></div></div><input id="file" type="file" accept="image/*" multiple hidden><script>const KEY='alina_catalog_v5';const cats=['Seturi pentru Moț','Tricouri personalizate','Ecusoane personalizate','Cake Toppers','Nuntă','Botez','Cadouri personalizate'];const seed=[{id:1,name:'Set moț băiat',price:70,qty:1,category:'Seturi pentru Moț',desc:'Set personalizat pentru moț.',custom:'Nume, fotografie copil, text personalizat',photos:[]},{id:2,name:'Set moț fetiță',price:70,qty:1,category:'Seturi pentru Moț',desc:'Set personalizat pentru moț.',custom:'Nume, fotografie copil, text personalizat',photos:[]}];let data=JSON.parse(localStorage.getItem(KEY)||'null')||seed;function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function render(){filter.innerHTML='<option value="">Toate categoriile</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');nCat.innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join('');let q=search.value.toLowerCase(),f=filter.value,a=data.filter(x=>(!q||(x.name+' '+x.desc).toLowerCase().includes(q))&&(!f||x.category===f));a.sort((x,y)=>sort.value==='price'?x.price-y.price:sort.value==='category'?x.category.localeCompare(y.category,'ro'):x.name.localeCompare(y.name,'ro'));grid.innerHTML=a.map(card).join('')}function card(x){let p=x.photos||[];return `<article class="card"><div class="photos">${[0,1,2].map((_,i)=>p[i]?`<div class="photo"><img src="${p[i]}"><button onclick="delPhoto(${x.id},${i})">×</button></div>`:'<div class="photo">Alege fotografie</div>').join('')}</div><h3>${esc(x.name)}</h3><div class="meta">${esc(x.category)} · ${p.length} fotografii</div><div class="fields"><input value="${esc(x.name)}" onchange="edit(${x.id},'name',this.value)" placeholder="Denumire"><input type="number" step="0.01" value="${x.price}" onchange="edit(${x.id},'price',this.value)" placeholder="Preț (£)"><select class="full" onchange="edit(${x.id},'category',this.value)">${cats.map(c=>`<option ${c===x.category?'selected':''}>${esc(c)}</option>`).join('')}</select><textarea class="full" onchange="edit(${x.id},'desc',this.value)" placeholder="Descriere">${esc(x.desc||'')}</textarea><textarea class="full" onchange="edit(${x.id},'custom',this.value)" placeholder="Opțiuni de personalizare">${esc(x.custom||'')}</textarea><input type="number" min="1" value="${x.qty||1}" onchange="edit(${x.id},'qty',this.value)" placeholder="Nr. bucăți"></div><div class="actions"><button class="btn" onclick="choose(${x.id})">+ Alege fotografii</button><button class="btn danger" onclick="removeProduct(${x.id})">Șterge produs</button></div></article>`}function edit(id,k,v){let x=data.find(x=>x.id===id);x[k]=['price','qty'].includes(k)?Number(v):v;save()}function choose(id){file.onchange=()=>{let x=data.find(x=>x.id===id);[...file.files].forEach(f=>{let r=new FileReader();r.onload=e=>{x.photos=x.photos||[];x.photos.push(e.target.result);save()};r.readAsDataURL(f)});file.value=''};file.click()}function delPhoto(id,i){let x=data.find(x=>x.id===id);x.photos.splice(i,1);save()}function removeProduct(id){if(confirm('Ștergi acest produs?')){data=data.filter(x=>x.id!==id);save()}}function openProduct(){modal.classList.add('open');nName.value='';nPrice.value='';nQty.value=1;nDesc.value='';nCustom.value='';nCat.value=cats[0]}function closeProduct(){modal.classList.remove('open')}function addProduct(){if(!nName.value.trim()){alert('Completează denumirea.');return}data.push({id:Date.now(),name:nName.value.trim(),price:Number(nPrice.value)||0,qty:Number(nQty.value)||1,category:nCat.value,desc:nDesc.value.trim(),custom:nCustom.value.trim(),photos:[]});save();closeProduct()}search.oninput=render;filter.onchange=render;sort.onchange=render;render();</script></body></html>
