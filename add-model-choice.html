<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizare modele — Alina's Handmade Boutique</title><style>body{font-family:Arial,sans-serif;background:#f7f8f3;color:#343a2d;margin:0;padding:40px}.box{max-width:760px;margin:auto;background:#fffdfa;border:1px solid #dfe2d3;border-radius:18px;padding:28px}h1{font-family:Georgia;color:#56613b}button{border:0;border-radius:10px;padding:12px 18px;background:#707b4c;color:#fff;font-weight:800;cursor:pointer}.status{margin-top:18px;padding:14px;border-radius:10px;background:#f1f3e8;line-height:1.6}.ok{color:#56613b}.err{color:#a45d68;background:#f9eeee}</style></head><body><div class="box"><h1>Actualizare produse</h1><p>Adaugă automat ultima opțiune <b>„Alege modelul dorit”</b> la fiecare model care are mai multe fotografii.</p><button id="go">Adaugă opțiunea la toate modelele</button><div id="status" class="status">Gata de pornire.</div></div><script>
const DB='AlinaCatalogFixed4',STORE='products',LS='alina_catalog_fixed4';
const $=id=>document.getElementById(id);
function getLS(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}
function setLS(a){localStorage.setItem(LS,JSON.stringify(a))}
function openDB(){return new Promise((resolve,reject)=>{try{const r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=e=>resolve(e.target.result);r.onerror=()=>reject(r.error||new Error('IndexedDB error'))}catch(e){reject(e)}})}
async function readAll(){try{const db=await openDB();return await new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readonly');const q=t.objectStore(STORE).getAll();q.onsuccess=()=>resolve(q.result||[]);q.onerror=()=>reject(q.error)})}catch(e){return getLS()}}
async function writeAll(arr){let db;try{db=await openDB();await new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readwrite');const s=t.objectStore(STORE);t.onerror=()=>reject(t.error);t.oncomplete=resolve;arr.forEach(p=>s.put(p))});return}catch(e){setLS(arr)}}
function addChoiceOption(p){const photos=p.photos||[];if(photos.length<2)return false;const opts=Array.isArray(p.options)?p.options:[];const idx=opts.findIndex(o=>(o.label||'').trim().toLowerCase()==='alege modelul dorit');if(idx>=0){const existing=opts[idx];const choices=photos.map((_,i)=>({label:'Model '+(i+1),price:0}));existing.type='buttons';existing.choices=choices;opts[idx]=existing}else{opts.push({label:'Alege modelul dorit',type:'buttons',choices:photos.map((_,i)=>({label:'Model '+(i+1),price:0}))})}p.options=opts;return true}
$('go').onclick=async()=>{const b=$('go');b.disabled=true;const s=$('status');s.className='status';s.textContent='Se actualizează produsele…';try{const items=await readAll();let changed=0;items.forEach(p=>{if(addChoiceOption(p))changed++});await writeAll(items);s.className='status ok';s.innerHTML='<b>Gata!</b><br>'+changed+' modele au primit opțiunea „Alege modelul dorit”.<br><br>Opțiunea este ultima din listă, iar fiecare fotografie a modelului devine o variantă: Model 1, Model 2, Model 3 etc.<br><br>Poți reveni acum în Manager.'}catch(e){s.className='status err';s.textContent='Eroare: '+e.message;b.disabled=false}};
</script></body></html>
