<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seturi pentru moț + tricouri tematice</title><style>:root{--o:#707b4c;--d:#56613b;--s:#f1f3e8;--l:#dfe2d3;--p:#c98698}*{box-sizing:border-box}body{margin:0;background:#fffdfa;color:#3d4336;font-family:Arial,sans-serif}.head{padding:18px 30px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center}.brand{font:28px Georgia;color:var(--d)}.brand small{display:block;font:10px Arial;letter-spacing:2px;margin-top:4px}.wrap{max-width:1200px;margin:auto;padding:35px 22px}.intro h1{font:42px Georgia;margin:0 0 8px}.intro p{color:#777b70}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:25px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:13px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:var(--s);border-radius:13px;padding:5px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.gallery img:first-child{grid-column:span 2;grid-row:span 2}.card h2{font:24px Georgia;margin:13px 3px 5px}.price{font-weight:800;color:var(--d)}.opts{background:#f7f8f2;border:1px solid #e1e3d6;border-radius:14px;padding:13px;margin-top:12px}.label{font-size:12px;font-weight:800;display:block;margin:8px 0 5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.btn{border:1px solid #cfd5c1;background:#fff;border-radius:9px;padding:10px 7px;font-size:12px;font-weight:800;cursor:pointer}.btn.active{background:var(--o);color:#fff;border-color:var(--o)}input,textarea,select{width:100%;border:1px solid #cfd5c1;border-radius:9px;padding:9px;background:#fff;font:inherit}.themed{margin-top:13px;padding:13px;border:2px dashed #d5d8c5;border-radius:13px;background:#fbfaf4}.themed h3{margin:0 0 4px;font-size:15px;color:var(--d)}.shirt{display:grid;grid-template-columns:1.2fr .8fr 1fr auto;gap:6px;margin-top:7px;align-items:center}.remove{border:0;background:#f4e9e6;color:#9a5148;border-radius:8px;padding:9px;cursor:pointer;font-weight:800}.add{margin-top:8px;border:0;background:#f1f3e8;color:var(--d);border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.summary{margin-top:12px;padding-top:10px;border-top:1px solid var(--l)}.total{font-size:18px;font-weight:900;color:var(--d);margin-top:7px}.shipping{font-size:13px;margin-top:5px}.order{width:100%;border:0;background:var(--o);color:#fff;border-radius:10px;padding:11px;margin-top:9px;font-weight:800;cursor:pointer}.note{font-size:11px;color:#727667;line-height:1.45}.empty{text-align:center;padding:35px;color:#777b70;border:2px dashed var(--l);border-radius:14px}.status{padding:15px;color:#777b70}.custom{margin-top:30px;background:#f5f6ed;border:1px solid var(--l);border-radius:18px;padding:20px}.custom h2{font:27px Georgia;margin:0 0 8px}.customgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.customgrid .full{grid-column:1/-1}@media(max-width:700px){.grid,.customgrid{grid-template-columns:1fr}.customgrid .full{grid-column:auto}.shirt{grid-template-columns:1fr 1fr}.shirt .remove{grid-column:2}.head{padding:15px 17px}.brand{font-size:23px}}</style></head><body><header><div class="head"><div class="brand">Alina's Handmade Boutique<small>DETALII MICI. AMINTIRI MARI.</small></div><a href="index.html" style="color:#56613b">← Catalog</a></div></header><main class="wrap"><section class="intro"><h1>Seturi pentru moț</h1><p>Alege modelul dorit și, dacă vrei, adaugă tricouri tematice pentru familie.</p></section><div id="status" class="status">Se încarcă modelele...</div><div id="grid" class="grid"></div><section class="custom"><h2>🎨 Nu găsești tema dorită?</h2><p>Scrie-ne tema și detaliile, iar noi vom crea un model potrivit pentru tine.</p><div class="customgrid"><input id="cn" placeholder="Numele copilului"><input id="cd" placeholder="Data"><input id="ct" class="full" placeholder="Tema dorită"><textarea id="cm" class="full" placeholder="Mesaj pentru tăviță (opțional)"></textarea></div></section></main><script>const SB_URL='https://zbfqhmiqjcvicqlidswo.supabase.co',SB_KEY='sb_publishable_d81c4EtU4mkkqgBnVQi9HQ_nf7M2zFb',H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},API=SB_URL+'/rest/v1';let photos=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function img(x){return/^https?:/i.test(x)?x:SB_URL+'/storage/v1/object/public/catalog/'+String(x).replace(/^\//,'')}async function api(p){const r=await fetch(API+p,{headers:H});if(!r.ok)throw Error(await r.text());return r.json()}function sizes(kind){return kind==='copil'?'<option value="2-3 ani">2-3 ani</option><option value="3-4 ani">3-4 ani</option><option value="5-6 ani">5-6 ani</option><option value="7-8 ani">7-8 ani</option><option value="9-11 ani">9-11 ani</option><option value="12-13 ani">12-13 ani</option>':'<option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option><option value="3XL">3XL</option>'}function shirtRow(box){const r=document.createElement('div');r.className='shirt';r.innerHTML='<input class="sn" placeholder="Ex. NASA / MAMA / TATA"><select class="sk"><option value="adult">Adult</option><option value="copil">Copil</option></select><select class="ss">'+sizes('adult')+'</select><button class="remove" type="button">×</button>';const k=r.querySelector('.sk'),s=r.querySelector('.ss');k.onchange=()=>s.innerHTML=sizes(k.value);r.querySelector('.remove').onclick=()=>{r.remove();update(box)};box.querySelector('.shirts').appendChild(r);update(box)}function update(card){const base=Number(card.dataset.base||70),photo=Number(card.dataset.photo||0),rows=[...card.querySelectorAll('.shirt')],shirts=rows.reduce((sum,r)=>sum+(r.querySelector('.sk').value==='copil'?10:13),0),weight=Number(card.dataset.weight||0.9)+rows.length*.2;card.querySelector('.total').textContent='Total: £'+(base+photo+shirts).toFixed(2);card.querySelector('.shipping').textContent='Livrare: '+(weight<=1?'£5.95':'£8.95')+' · Greutate estimată: '+weight.toFixed(2)+' kg'}function card(m){const ps=photos.filter(x=>x.product_id===m.id).sort((a,b)=>(a.display_order||0)-(b.display_order||0));const gal=ps.length?'<div class="gallery">'+ps.slice(0,9).map(x=>'<img src="'+esc(img(x.image_url))+'" alt="'+esc(m.name)+'" loading="lazy">').join('')+'</div>':'<div class="empty">Nu există fotografii.</div>';return '<article class="card" data-base="'+Number(m.price||70)+'" data-photo="0" data-weight="'+Number(m.weight||0.9)+'">'+gal+'<h2>'+esc(m.name)+'</h2><p class="price">Set: £'+Number(m.price||70).toFixed(2)+'</p><div class="opts"><span class="label">Alege tava</span><div class="row"><button class="btn active tray" data-v="70">Tavă dreptunghiulară £70</button><button class="btn tray" data-v="80">Tavă rotundă £80</button></div><span class="label">Fotografie copil</span><div class="row"><button class="btn active ph" data-v="0">Fără fotografie</button><button class="btn ph" data-v="5">Adaugă fotografie copil +£5</button></div><label class="label">Numele copilului</label><input class="name" placeholder="Ex. Sofia"><label class="label">Data</label><input class="date" placeholder="Ex. 12.05.2027"><label class="label">Mesaj pentru tăviță (opțional)</label><textarea class="msg" placeholder="Scrie mesajul dorit..."></textarea><div class="themed"><h3>👕 ADAUGĂ ȘI TRICOURI TEMATICE</h3><p class="note">Adaugă câte un tricou pentru fiecare persoană. Scrie numele/rolul persoanei și alege mărimea.</p><div class="shirts"></div><button class="add" type="button">＋ Adaugă tricou</button></div><div class="summary"><div class="total">Total: £'+Number(m.price||70).toFixed(2)+'</div><div class="shipping">Livrare: £5.95 · Greutate estimată: '+Number(m.weight||0.9).toFixed(2)+' kg</div></div><button class="order" type="button">Comandă</button></div></article>'}function bind(){document.querySelectorAll('.card').forEach(c=>{c.querySelectorAll('.tray').forEach(b=>b.onclick=()=>{c.dataset.base=b.dataset.v;c.querySelectorAll('.tray').forEach(x=>x.classList.toggle('active',x===b));update(c)});c.querySelectorAll('.ph').forEach(b=>b.onclick=()=>{c.dataset.photo=b.dataset.v;c.querySelectorAll('.ph').forEach(x=>x.classList.toggle('active',x===b));update(c)});c.querySelector('.add').onclick=()=>shirtRow(c);c.querySelector('.order').onclick=()=>{const shirts=[...c.querySelectorAll('.shirt')].map(r=>{const n=r.querySelector('.sn').value.trim();const k=r.querySelector('.sk').value;const s=r.querySelector('.ss').value;return n?`${n} — ${k==='copil'?'copil':'adult'} — ${s} — £${k==='copil'?'10':'13'}`:''}).filter(Boolean);const text='Bună! Doresc setul pentru moț „'+c.querySelector('h2').textContent+'”. Tavă: '+c.querySelector('.tray.active').textContent+'. '+c.querySelector('.ph.active').textContent+'. Nume copil: '+(c.querySelector('.name').value||'-')+'. Data: '+(c.querySelector('.date').value||'-')+'. Mesaj: '+(c.querySelector('.msg').value||'-')+'. Tricouri tematice: '+(shirts.length?shirts.join('; '):'nu')+'. '+c.querySelector('.shipping').textContent+'. '+c.querySelector('.total').textContent+'.';window.open('https://wa.me/447742444493?text='+encodeURIComponent(text),'_blank')}})}async function load(){try{const products=await api('/catalog_products?select=*&category=eq.Seturi%20pentru%20Mo%C8%9B&order=display_order.asc,created_at.desc');try{photos=await api('/catalog_product_photos?select=*&order=display_order.asc')}catch{}document.getElementById('grid').innerHTML=products.map(card).join('')||'<div class="empty">Nu există încă modele în această categorie.</div>';document.getElementById('status').style.display='none';bind()}catch(e){document.getElementById('status').textContent='Eroare: '+e.message}}load();</script></body></html>
