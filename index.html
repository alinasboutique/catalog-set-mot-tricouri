<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alina's Handmade Boutique | Catalog</title>
<style>
html,body{margin:0;padding:0;width:100%;background:#fffdf9;overflow-x:hidden}
#catalogFrame{display:block;width:100%;height:100vh;border:0}
</style>
</head>
<body>
<iframe id="catalogFrame" src="catalog-final.html?v=20261020" title="Alina's Handmade Boutique | Catalog"></iframe>
<script>
const frame=document.getElementById('catalogFrame');
function applyCatalogDesign(){
  const doc=frame.contentDocument;
  if(!doc||!doc.head)return;

  const heroBox=doc.querySelector('.hero-box');
  const heroCopy=doc.querySelector('.hero-copy');
  const heroTitle=doc.querySelector('.hero h2');
  const heroText=doc.querySelector('.hero p');
  const heroArt=doc.querySelector('.hero-art');

  if(heroBox&&heroCopy){
    if(heroArt) heroArt.remove();
    heroTitle.innerHTML='Detalii mici.<br>Amintiri mari.';
    heroText.textContent='Produse personalizate create cu drag pentru botez, nuntă, aniversări și toate momentele care merită păstrate.';
    heroBox.classList.add('alina-elegant-hero');
    heroCopy.classList.add('alina-elegant-copy');

    let style=doc.getElementById('alinaElegantHeroStyle');
    if(!style){
      style=doc.createElement('style');
      style.id='alinaElegantHeroStyle';
      doc.head.appendChild(style);
    }
    style.textContent=`
      .hero-box.alina-elegant-hero{
        min-height:430px!important;
        display:block!important;
        position:relative!important;
        overflow:hidden!important;
        background:#fffaf7 url('hero-floral.svg?v=20261020-2') center/cover no-repeat!important;
        border:1px solid #ecd7d0!important;
      }
      .hero-box.alina-elegant-hero:after{
        content:'';
        position:absolute;
        inset:0;
        background:rgba(255,250,247,.10);
        pointer-events:none;
      }
      .hero-copy.alina-elegant-copy{
        position:relative!important;
        z-index:2!important;
        width:min(760px,82%)!important;
        margin:0 auto!important;
        padding:62px 20px 58px!important;
        text-align:center!important;
      }
      .alina-elegant-copy .kicker{
        display:inline-flex!important;
        align-items:center!important;
        gap:0!important;
        color:#8e4c5b!important;
        letter-spacing:3px!important;
      }
      .alina-elegant-copy .kicker:before,.alina-elegant-copy .kicker:after{
        display:none!important;
      }
      .hero h2.alina-elegant-title{
        font:500 58px/1.04 Georgia,'Times New Roman',serif!important;
        font-style:normal!important;
        letter-spacing:-.5px!important;
        margin:18px 0 20px!important;
        color:#7d3f4c!important;
      }
      .alina-elegant-copy p{
        max-width:720px!important;
        margin:0 auto 28px!important;
        color:#665955!important;
        font:18px/1.55 Georgia,'Times New Roman',serif!important;
      }
      .alina-elegant-copy .hero-btn{padding:13px 28px!important;border-radius:28px!important}
      .alina-elegant-copy:after{content:'♡';display:block;margin:22px auto 0;color:#c58a99;font-size:27px;line-height:1}
      @media(max-width:600px){
        .hero-box.alina-elegant-hero{min-height:430px!important}
        .hero-copy.alina-elegant-copy{width:88%!important;padding:52px 10px 45px!important}
        .hero h2.alina-elegant-title{font-size:43px!important}
        .alina-elegant-copy p{font-size:16px!important}
      }
    `;
    heroTitle.classList.add('alina-elegant-title');
  }

  const visual=doc.querySelector('.category[href="catalog-nou-v5.html"] .cat-visual');
  if(visual){
    if(!visual.querySelector('.mot-category-photo')){
      visual.innerHTML='<img class="mot-category-photo" src="hero-photo.jpg" alt="Seturi pentru moț realizate de Alina\'s Handmade Boutique"><div class="cat-arrow">↗</div>';
    }
    let photoStyle=doc.getElementById('motCategoryPhotoStyle');
    if(!photoStyle){
      photoStyle=doc.createElement('style');
      photoStyle.id='motCategoryPhotoStyle';
      doc.head.appendChild(photoStyle);
    }
    photoStyle.textContent='.category[href="catalog-nou-v5.html"] .cat-visual{display:block;background:#f8eee9}.category[href="catalog-nou-v5.html"] .cat-visual:before,.category[href="catalog-nou-v5.html"] .cat-visual:after{display:none}.category[href="catalog-nou-v5.html"] .mot-category-photo{width:100%;height:100%;display:block;object-fit:cover;object-position:center;border-radius:0}.category[href="catalog-nou-v5.html"] .cat-arrow{z-index:5}';
  }

  const resize=()=>{frame.style.height=Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight)+'px'};
  resize();
  if(window.ResizeObserver&&!frame._alinaObserver){frame._alinaObserver=new ResizeObserver(resize);frame._alinaObserver.observe(doc.documentElement)}
}
function start(){applyCatalogDesign();setTimeout(applyCatalogDesign,150);setTimeout(applyCatalogDesign,800)}
frame.addEventListener('load',start);
if(frame.contentDocument&&frame.contentDocument.readyState==='complete')start();
</script>
</body>
</html>
