<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Completează opțiunile – Fetițe</title><style>body{font-family:Arial,sans-serif;background:#f7f8f3;color:#343a2d;max-width:800px;margin:auto;padding:30px}section{background:#fffdfa;border:1px solid #dfe2d3;border-radius:16px;padding:25px}button{background:#707b4c;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.ok{color:#56613b}.err{color:#a45d68}.log{margin-top:15px;font-size:14px;line-height:1.7}</style></head><body><section><h1>Completează opțiunile pentru Fetițe</h1><p>Acest instrument adaugă la finalul fiecărui model de fetiță opțiunea <b>Alege modelul poza nr</b>, folosind numărul real de fotografii ale modelului.</p><button id="go">Adaugă opțiunea la toate modelele pentru fetițe</button><div id="status" class="log"></div></section><script>const DB='AlinaCatalogFixed4',STORE='products',LS='alina_catalog_fixed4';const $=x=>document.getElementById(x);function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=e=>resolve(e.target.result);r.onerror=()=>reject(r.error||new Error('IndexedDB error'))})}function ls(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}function lsw(a){localStorage.setItem(LS,JSON.stringify(a))}async function run(){const b=$('go');b.disabled=true;$('status').textContent='Se actualizează…';try{const db=await openDB();const all=await new Promise((ok,no)=>{const t=db.transaction(STORE,'readonly'),q=t.objectStore(STORE).getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error)});const girls=all.filter(p=>{const c=String(p.category||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return c.includes('fetita')||c.includes('fetite')||c==='f'||c==='girl'});let changed=0;for(const p of girls){const count=(p.photos||[]).length;if(!count)continue;const opts=Array.isArray(p.options)?p.options.filter(Boolean):[];const idx=opts.findIndex(o=>String(o.label||'').toLowerCase().includes('alege modelul poza'));const modelOpt={label:'Alege modelul poza nr',type:'select',choices:Array.from({length:count},(_,i)=>({label:'Model '+(i+1),price:0}))};if(idx>=0)opts.splice(idx,1);opts.push(modelOpt);p.options=opts;await new Promise((ok,no)=>{const t=db.transaction(STORE,'readwrite');t.oncomplete=ok;t.onerror=()=>no(t.error);t.objectStore(STORE).put(p)});changed++}const backup=all.filter(p=>!girls.includes(p));try{lsw(all)}catch(e){}$('status').className='log ok';$('status').innerHTML='✓ Gata! Au fost actualizate <b>'+changed+'</b> modele pentru fetițe. Opțiunea „Alege modelul poza nr” a fost pusă ultima și are automat câte o variantă pentru fiecare fotografie.'}catch(e){$('status').className='log err';$('status').textContent='Eroare: '+(e.message||e)}finally{b.disabled=false}}$('go').onclick=run;</script></body></html>
