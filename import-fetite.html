<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Importă modele fetițe</title><style>body{font-family:Arial,sans-serif;background:#f7f8f3;color:#343a2d;margin:0;padding:35px}.box{max-width:760px;margin:auto;background:#fffdfa;border:1px solid #dfe2d3;border-radius:18px;padding:28px}.ok{color:#56613b}.err{color:#a45d68}.log{background:#f1f3e8;padding:15px;border-radius:10px;line-height:1.6;margin-top:15px}button{background:#707b4c;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}</style></head><body><div class="box"><h1>🎀 Importă modelele pentru fetițe</h1><p>Acest instrument adaugă în Manager modelele pentru fetițe din catalogul vechi, împreună cu toate fotografiile disponibile și opțiunile standard de personalizare.</p><button id="go">Importă modelele pentru fetițe</button><div id="status" class="log">Pregătit.</div></div><script>
const DB='AlinaCatalogFixed4',STORE='products',LS='alina_catalog_fixed4';
const SB_URL='https://zbfqhmiqjcvicqlidswo.supabase.co';
const SB_KEY='sb_publishable_d81c4EtU4mkkqgBnVQi9HQ_nf7M2zFb';
const H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
const $=id=>document.getElementById(id); const status=t=>$('status').innerHTML=t;
function norm(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function isGirl(v){const n=norm(v);return ['f','fata','fetite','girl'].includes(n)||n.includes('fetit')||n.includes('girl')}
function openDB(){return new Promise((resolve,reject)=>{try{const r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=e=>resolve(e.target.result);r.onerror=()=>reject(r.error||new Error('IndexedDB error'))}catch(e){reject(e)}})}
function readLS(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}
async function all(){try{const d=await openDB();return await new Promise((ok,no)=>{const t=d.transaction(STORE,'readonly'),q=t.objectStore(STORE).getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error)})}catch(e){return readLS()}}
async function save(p){try{const d=await openDB();await new Promise((ok,no)=>{const t=d.transaction(STORE,'readwrite');t.oncomplete=ok;t.onerror=()=>no(t.error||new Error('Salvarea a eșuat'));t.objectStore(STORE).put(p)})}catch(e){const a=readLS(),i=a.findIndex(x=>x.id===p.id);i<0?a.push(p):a[i]=p;localStorage.setItem(LS,JSON.stringify(a))}}
function publicPhoto(p){if(!p)return '';if(/^https?:\/\//i.test(p))return p;return SB_URL+'/storage/v1/object/public/mot-models/'+String(p).replace(/^\//,'')}
function defaults(){return[{label:'Alege tava',type:'buttons',choices:[{label:'Tavă dreptunghiulară',price:70},{label:'Tavă rotundă',price:80}]},{label:'Fotografie copil',type:'buttons',choices:[{label:'Fără fotografie',price:0},{label:'Adaugă fotografie copil',price:5}]},{label:'Numele copilului',type:'text',choices:[]},{label:'Data',type:'text',choices:[]},{label:'Mesaj tăviță (opțional)',type:'textarea',choices:[]}]}
async function run(){const b=$('go');b.disabled=true;status('Se citesc modelele pentru fetițe din catalogul vechi…');try{const r=await fetch(SB_URL+'/rest/v1/mot_models?select=id,category,name,display_order,is_active,created_at&is_active=eq.true&order=display_order.asc,created_at.asc',{headers:H});if(!r.ok)throw new Error('Modelele nu pot fi încărcate: '+r.status);const models=(await r.json()).filter(m=>isGirl(m.category));if(!models.length)throw new Error('Nu am găsit modele de fetiță în sursa catalogului vechi.');const ids=models.map(m=>m.id);const pr=await fetch(SB_URL+'/rest/v1/mot_model_photos?select=id,model_id,image_url,is_main,display_order&model_id=in.('+ids.join(',')+')&order=display_order.asc',{headers:H});if(!pr.ok)throw new Error('Fotografiile nu pot fi încărcate: '+pr.status);const photos=await pr.json();const existing=await all();let added=0,updated=0;for(const m of models){const ps=photos.filter(p=>p.model_id===m.id).sort((a,b)=>{if(!!a.is_main!==!!b.is_main)return a.is_main?-1:1;return (a.display_order||0)-(b.display_order||0)}).map(p=>publicPhoto(p.image_url)).filter(Boolean);const category='Seturi pentru moț – fetiță';const same=existing.find(x=>norm(x.name)===norm(m.name)&&norm(x.category)===norm(category));const item=same?{...same,name:m.name,category,photos:ps,displayOrder:m.display_order||0}:{id:'girl-'+m.id,name:m.name,category,price:70,weight:0,desc:'Set pentru moț personalizabil.',photos:ps,options:defaults(),displayOrder:m.display_order||0};await save(item);if(same){Object.assign(same,item);updated++}else{existing.push(item);added++}}status('<span class="ok"><b>Import finalizat! 🎉</b><br>'+models.length+' modele pentru fetițe procesate.<br>'+added+' adăugate · '+updated+' actualizate.<br>Fotografii importate: '+photos.length+'.<br><br>Acum poți reveni în Manager și vei vedea modelele.</span>')}catch(e){status('<span class="err"><b>Eroare:</b> '+String(e.message||e)+'</span>')}finally{b.disabled=false}}
$('go').onclick=run;
</script></body></html>
