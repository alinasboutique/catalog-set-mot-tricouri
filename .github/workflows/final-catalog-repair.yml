name: Final catalog repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair catalog rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # The dedicated moț catalog uses mot_models + mot_model_photos.
          # catalog-final must use the same source, otherwise Supabase rejects
          # the old catalog_products request before any photos can be rendered.
          p = Path('catalog-final.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              '/catalog_products?select=*&order=display_order.asc,created_at.desc': '/mot_models?select=id,category,name,display_order,is_active,created_at&is_active=eq.true&order=display_order.asc,created_at.asc',
              '/catalog_product_photos?select=*&order=display_order.asc,created_at.asc': '/mot_model_photos?select=id,model_id,image_url,is_main,display_order&order=display_order.asc',
              'String(x.product_id)': 'String(x.model_id)',
              "SB+'/storage/v1/object/public/catalog/'+s": "SB+'/storage/v1/object/public/mot-models/'+s",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-final.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix mot models source in final catalog"
          git push
