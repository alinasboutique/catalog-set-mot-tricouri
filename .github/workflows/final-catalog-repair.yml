name: Final catalog repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify catalog placement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('catalog-final.html')
          s = p.read_text(encoding='utf-8')

          # The main catalog must link to the dedicated moț page.
          s = s.replace('<a href="#mot">Seturi Moț</a>', '<a href="catalog-nou-v5.html">Seturi Moț</a>', 1)
          s = s.replace('<a class="category" href="#mot">', '<a class="category" href="catalog-nou-v5.html">', 1)

          # If the product block is already gone, leave the catalog untouched.
          start_marker = '<div class="subsection" id="mot">'
          start = s.find(start_marker)
          if start == -1:
              p.write_text(s, encoding='utf-8')
              print('Catalog already has the moț products on the dedicated page.')
              raise SystemExit(0)

          end = s.find('</section>', start)
          if end == -1:
              raise SystemExit('Could not find the end of the main catalog section.')

          s = s[:start] + s[end:]
          p.write_text(s, encoding='utf-8')
          print('Moved the moț product block to the dedicated category page.')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-final.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Move moț products to dedicated category page"
          git push
