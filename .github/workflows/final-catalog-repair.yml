name: Final catalog repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair catalog rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('catalog-final.html')
          s = p.read_text(encoding='utf-8')

          # Keep the existing main catalog design intact. Only make the
          # targeted structural change: the product galleries belong on the
          # dedicated moț category page, not on the home/catalog landing page.
          s = s.replace('<a href="#mot">Seturi Moț</a>', '<a href="catalog-nou-v5.html">Seturi Moț</a>', 1)
          s = s.replace('<a class="category" href="#mot">', '<a class="category" href="catalog-nou-v5.html">', 1)

          # Remove the complete product/subcategory block from the landing
          # page, starting at the moț subsection and ending at the catalog
          # section closing tag. This leaves the existing category cards,
          # reviews and footer untouched.
          s, removed = re.subn(
              r'\n<div class="subsection" id="mot">.*?\n</section>',
              '\n</section>',
              s,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit('Expected exactly one main-catalog moț subsection block.')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-final.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Move moț products to dedicated category page"
          git push
