name: Final catalog repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair catalog rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('catalog-final.html')
          s = p.read_text(encoding='utf-8')

          # Keep the existing landing-page design. Only send the moț
          # collection to its dedicated page and remove the product blocks
          # from the landing page itself.
          s = s.replace('<a href="#mot">Seturi Moț</a>', '<a href="catalog-nou-v5.html">Seturi Moț</a>', 1)
          s = s.replace('<a class="category" href="#mot">', '<a class="category" href="catalog-nou-v5.html">', 1)

          start_marker = '<div class="subsection" id="mot">'
          start = s.find(start_marker)
          if start == -1:
              raise SystemExit('Could not find the main-catalog moț subsection.')

          end = s.find('</section>', start)
          if end == -1:
              raise SystemExit('Could not find the end of the main catalog section.')

          # Remove only the content inside the catalog section after the
          # category cards. Reviews and footer remain exactly where they are.
          s = s[:start] + s[end:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-final.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Move moț products to dedicated category page"
          git push
