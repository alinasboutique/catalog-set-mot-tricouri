name: Fix mot model images

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch catalog
        run: python scripts/fix_mot_images.py

      - name: Commit patched catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js
          git diff --cached --quiet || git commit -m "Fix loading existing mot model photos"
          git push
