name: Install hero photo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rasterize the existing hero photo
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          rsvg-convert -w 1200 -h 800 hero-photo.svg -o hero-photo.png
          convert hero-photo.png -strip -quality 92 hero-photo.jpg
      - name: Point the page to the real raster image
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<img class="hero-photo" src="hero-photo.svg" alt="Set personalizat pentru moț realizat de Alina\'s Handmade Boutique">'
          new='<img class="hero-photo" src="hero-photo.jpg" alt="Set personalizat pentru moț realizat de Alina\'s Handmade Boutique">'
          if old not in s:
              raise SystemExit('Expected hero image tag not found; refusing to change anything else.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit only the hero fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-photo.png hero-photo.jpg index.html
          git commit -m "Fix hero photo rendering"
          git push
