name: Fix hero photo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only hero image source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          new = '<img class="hero-photo" src="hero-photo.svg" alt="Set personalizat pentru moț realizat de Alina\'s Handmade Boutique">'
          s2, n = re.subn(r'<img class="hero-photo"[^>]*>', new, s, count=1)
          if n != 1:
              raise SystemExit(f'Hero image tag not found exactly once: {n}')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit exact image fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix hero photo source" || exit 0
          git push
